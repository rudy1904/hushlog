; PlatformIO project for Hushlog test firmware.
; Build with: pio run    Upload with: pio run -t upload
; (hold BOOTSEL when plugging in the first time, or the Arduino-Pico
;  core will reset into the bootloader for you on later uploads.)

[env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200

lib_deps =
    greiman/SdFat@^2.2.2
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
